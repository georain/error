<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>HONEYPOT // 蜜罐嘲讽系统</title>
<style>
  :root {
    --bg: #0a0e14;
    --fg: #d7e3f4;
    --dim: #7a8aa3;
    --red: #ff4757;
    --red-soft: rgba(255, 71, 87, .12);
    --cyan: #00d2ff;
    --green: #2ecc71;
    --amber: #ffa502;
    --border: rgba(255, 255, 255, .10);
    --glass: rgba(255, 255, 255, .05);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(0, 210, 255, .10), transparent 60%),
      radial-gradient(900px 500px at 10% 110%, rgba(255, 71, 87, .12), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    overflow-x: hidden;
  }
  /* 背景网格 + 扫描线 */
  .grid {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      linear-gradient(rgba(255,255,255,.035) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 44px 44px;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 90%);
    -webkit-mask-image: radial-gradient(ellipse at center, black 40%, transparent 90%);
  }
  .scanline {
    position: fixed; left: 0; right: 0; height: 120px; z-index: 0; pointer-events: none;
    background: linear-gradient(to bottom, transparent, rgba(0,210,255,.05), transparent);
    animation: scan 7s linear infinite;
  }
  @keyframes scan {
    0% { top: -20%; } 100% { top: 120%; }
  }
  .wrap { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 32px 20px 64px; }

  /* 顶部状态栏 */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 10px 18px; border-radius: 12px;
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(140%);
    -webkit-backdrop-filter: blur(18px) saturate(140%);
    border: 1px solid var(--border);
    font-family: Consolas, "Courier New", monospace; font-size: 13px;
  }
  .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 8px; background: var(--red); animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: .15; } }
  .status-ok { color: var(--green); }
  .topbar .right { color: var(--dim); }

  /* 标题区 */
  .hero { margin: 44px 0 28px; text-align: center; }
  .hero .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-family: Consolas, monospace; font-size: 12px; letter-spacing: 3px;
    color: var(--red); border: 1px solid rgba(255,71,87,.35); background: var(--red-soft);
    padding: 6px 16px; border-radius: 999px; text-transform: uppercase;
  }
  .hero h1 {
    margin-top: 18px; font-size: clamp(28px, 5vw, 48px); font-weight: 800; letter-spacing: 2px;
    background: linear-gradient(90deg, var(--red), #ff9f43);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .hero p { margin-top: 12px; color: var(--dim); font-size: 15px; }

  /* 毛玻璃卡片 */
  .glass {
    background: var(--glass);
    backdrop-filter: blur(20px) saturate(150%);
    -webkit-backdrop-filter: blur(20px) saturate(150%);
    border: 1px solid var(--border);
    border-radius: 16px;
  }
  .card { padding: 22px 24px; margin-bottom: 22px; }
  .card h2 {
    font-size: 13px; letter-spacing: 2px; text-transform: uppercase;
    color: var(--dim); font-family: Consolas, monospace; margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .card h2::before { content: "//"; color: var(--cyan); }

  /* 检测结果徽章 */
  .badges { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 6px; }
  .badge {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 14px; border-radius: 8px; font-size: 13px; font-weight: 600;
    background: rgba(255,71,87,.10); border: 1px solid rgba(255,71,87,.35); color: var(--red);
  }
  .badge.clean { background: rgba(46,204,113,.08); border-color: rgba(46,204,113,.30); color: var(--green); }
  .kbd {
    font-family: Consolas, monospace; font-size: 12px; color: var(--amber);
    background: rgba(255,165,2,.08); border: 1px solid rgba(255,165,2,.30);
    padding: 2px 8px; border-radius: 6px; word-break: break-all;
  }
  .meta-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 12px; margin-top: 16px;
  }
  .meta-item .label { font-size: 11px; color: var(--dim); letter-spacing: 1px; margin-bottom: 4px; font-family: Consolas, monospace; }
  .meta-item .value { font-size: 13px; font-family: Consolas, monospace; word-break: break-all; }

  /* 嘲讽主卡 */
  .troll-card { position: relative; overflow: hidden; text-align: center; padding: 46px 30px; }
  .troll-card::before {
    content: ""; position: absolute; inset: 0; pointer-events: none;
    background: linear-gradient(120deg, transparent 30%, rgba(255,255,255,.04) 50%, transparent 70%);
    background-size: 250% 100%; animation: sheen 6s linear infinite;
  }
  @keyframes sheen { 0% { background-position: 200% 0; } 100% { background-position: -50% 0; } }
  .lang-pill {
    display: inline-block; font-size: 13px; font-weight: 700;
    color: var(--cyan); border: 1px solid rgba(0,210,255,.35); background: rgba(0,210,255,.08);
    padding: 5px 14px; border-radius: 999px; letter-spacing: 1px;
  }
  .troll-text {
    margin: 26px auto 8px; max-width: 640px;
    font-size: clamp(18px, 3vw, 26px); line-height: 1.7; font-weight: 600;
    min-height: 3.4em; display: flex; align-items: center; justify-content: center;
  }
  .troll-text .cursor { display: inline-block; width: 10px; height: 1.2em; margin-left: 3px; background: var(--cyan); animation: blink .8s steps(2) infinite; vertical-align: -0.15em; }
  .troll-sub { color: var(--dim); font-size: 13px; font-family: Consolas, monospace; }

  /* 按钮 */
  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 22px; }
  .btn {
    appearance: none; cursor: pointer; font-family: inherit; font-size: 14px; font-weight: 600;
    padding: 11px 22px; border-radius: 10px; color: var(--fg);
    background: rgba(255,255,255,.06); border: 1px solid var(--border);
    transition: all .18s ease; display: inline-flex; align-items: center; gap: 8px;
  }
  .btn:hover { background: rgba(255,255,255,.12); transform: translateY(-1px); }
  .btn.primary { background: linear-gradient(135deg, rgba(255,71,87,.85), rgba(255,159,67,.85)); border-color: transparent; color: #fff; }
  .btn.primary:hover { filter: brightness(1.1); }
  .btn:active { transform: translateY(0); }

  /* 语料库网格 */
  .lang-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .lang-item { padding: 14px 16px; border-radius: 12px; background: rgba(255,255,255,.03); border: 1px solid var(--border); }
  .lang-item .lh { font-size: 12px; color: var(--cyan); font-family: Consolas, monospace; margin-bottom: 6px; }
  .lang-item .lt { font-size: 14px; line-height: 1.6; color: var(--fg); }

  /* 终端 */
  .terminal {
    background: rgba(4, 8, 12, .75);
    border: 1px solid var(--border);
    border-radius: 14px; overflow: hidden;
    font-family: Consolas, "Courier New", monospace; font-size: 13px;
  }
  .term-bar {
    display: flex; align-items: center; gap: 8px; padding: 10px 14px;
    background: rgba(255,255,255,.04); border-bottom: 1px solid var(--border);
  }
  .term-bar .t-dot { width: 11px; height: 11px; border-radius: 50%; }
  .term-bar .t-dot:nth-child(1) { background: #ff5f57; } .term-bar .t-dot:nth-child(2) { background: #febc2e; } .term-bar .t-dot:nth-child(3) { background: #28c840; }
  .term-bar .t-title { margin-left: 8px; color: var(--dim); font-size: 12px; }
  .term-body { padding: 16px; min-height: 220px; max-height: 340px; overflow-y: auto; line-height: 1.8; }
  .term-body .ln { white-space: pre-wrap; word-break: break-all; }
  .ln .t-time { color: #4a5a72; margin-right: 8px; }
  .ln .t-ok { color: var(--green); } .ln .t-warn { color: var(--amber); } .ln .t-err { color: var(--red); } .ln .t-info { color: var(--cyan); } .ln .t-dim { color: var(--dim); }

  footer { margin-top: 30px; text-align: center; color: var(--dim); font-size: 12px; line-height: 1.8; }
  footer code { background: rgba(255,255,255,.07); padding: 2px 7px; border-radius: 5px; font-family: Consolas, monospace; }

  @media (max-width: 560px) {
    .wrap { padding: 20px 14px 48px; }
    .card { padding: 18px; }
    .troll-card { padding: 34px 18px; }
  }
</style>
</head>

  },
  ar: {

    "hero.sub": "كل ما حصلت عليه من مسحك هو هذه الصفحة الساخرة. أضفها للمفضلة لتوفر جهدك في المرة القادمة.",

    "docTitle": "HONEYPOT // نظام السخرية",

    "log.init": "[*] تم تهيئة HONEYPOT، المستشعرات جاهزة",

    "log.ip": "[i] تم تسجيل عنوان IP الخاص بك في القائمة السوداء (مزحة — لا يوجد خادم. مخيف، أليس كذلك؟)",
    "log.done": "[✓] تم توليد السخرية. استمتع بهذه الصفحة بـ {n} لغات.",
    "log.copyOk": "[✓] تم نسخ السخرية — شاركها مع زملائك",
    "log.copyOk2": "[✓] تم نسخ السخرية (وضع التوافق)",
    "log.rescan": "[*] إعادة فحص يدوية…",
    "log.switch": "[i] تم تغيير اللغة: {flag} {name}"

/* ============ 检测规则 ============ */
const RULES = [
  { id: "sql", patterns: [
    /['"]\s*(or|and)\s+['"]?\d/i, /union\s+select/i, /select\s+.+\s+from/i,
    /drop\s+table/i, /information_schema/i, /--\s*$/, /;\s*--/, /sleep\s*\(/i,
    /concat\s*\(/i, /group\s+by/i, /0x[0-9a-f]{6,}/i, /\bwaitfor\b/i
  ]},
  { id: "xss", patterns: [
    /<script/i, /javascript:/i, /onerror\s*=/i, /onload\s*=/i, /alert\s*\(/i,
    /<img/i, /<svg/i, /<iframe/i, /document\.cookie/i, /eval\s*\(/i, /prompt\s*\(/i
  ]},
  { id: "traversal", patterns: [
    /\.\.\//, /\.\.%2f/i, /\.\.\\/, /\/etc\/passwd/i, /\/etc\/shadow/i,
    /\/windows\/win\.ini/i, /boot\.ini/i, /%2e%2e%2f/i
  ]},
  { id: "scan", patterns: [
    /wp-admin/i, /wp-login/i, /\.env/i, /config\.php/i, /\.git\//i, /\.svn/i,
    /phpmyadmin/i, /admin\.php/i, /xmlrpc\.php/i, /shell\.php/i, /\.bak/i, /\.sql/i
  ]},
  { id: "bot", patterns: [
    /sqlmap/i, /nikto/i, /nessus/i, /nmap/i, /masscan/i, /acunetix/i,
    /burpsuite/i, /hydra/i, /python-requests/i, /go-http-client/i,
    /libwww-perl/i, /curl\//i, /wget/i, /MJ12bot/i, /AhrefsBot/i,
    /SemrushBot/i, /DotBot/i, /Bytespider/i, /DataForSeoBot/i, /YandexBot/i
  ]}
];

/* ============ 状态 ============ */
const state = { lang: "zh", hitTypes: [], sample: null, longUrl: false };

/* ============ 工具函数 ============ */
const $ = id => document.getElementById(id);
const termBody = $("termBody");

function t(key, vars) {
  const dict = I18N[state.lang] || I18N.zh;
  let s = dict[key] != null ? dict[key] : (I18N.zh[key] != null ? I18N.zh[key] : key);
  if (vars) for (const k in vars) s = s.split("{" + k + "}").join(String(vars[k]));
  return s;
}

function now() { return new Date().toLocaleTimeString("en-GB", { hour12: false }); }

function log(cls, msg) {
  const line = document.createElement("div");
  line.className = "ln";
  line.innerHTML = `<span class="t-time">[${now()}]</span><span class="${cls}"></span>`;
  line.lastChild.textContent = msg;
  termBody.appendChild(line);
  termBody.scrollTop = termBody.scrollHeight;
}

/* ============ 检测逻辑 ============ */
function analyze() {
  state.hitTypes = [];
  state.longUrl = false;
  const haystack = [location.href, decodeURIComponent(location.search), location.hash, navigator.userAgent, document.referrer].join("\n");
  const samples = [];

  for (const rule of RULES) {
    const m = haystack.match(new RegExp(rule.patterns.map(p => p.source).join("|"), "i"));
    if (m) {
      state.hitTypes.push(rule.id);
      samples.push(m[0]);
      log("t-err", t("log.hit", { name: ATTRS[rule.id][state.lang], sample: m[0].slice(0, 60) }));
    }
  }

  if (location.href.length > 2000) {
    state.longUrl = true;
    log("t-err", t("log.longUrl", { n: location.href.length }));
  }

  state.sample = samples[0] || null;
  return state.hitTypes;
}

/* ============ 渲染 ============ */
function renderBadges() {
  const box = $("badges");
  box.innerHTML = "";
  const types = state.hitTypes;
  const levelEl = $("level");
  if (!types.length) {
    box.innerHTML = `<span class="badge clean"></span>`;
    box.firstChild.textContent = t("badge.clean");
    levelEl.textContent = t("level.low");
    levelEl.style.color = "var(--green)";
    $("matchSample").textContent = "—";
    return;
  }
  types.forEach(ft => {
    const b = document.createElement("span");
    b.className = "badge";
    b.textContent = `⚠ ${ATTRS[ft][state.lang]}`;
    box.appendChild(b);
  });
  levelEl.textContent = types.length > 1 ? t("level.critical") : t("level.high");
  levelEl.style.color = "var(--red)";
  $("matchSample").textContent = state.sample || "—";
}

function pickTroll(langCode) {
  const types = state.hitTypes;
  if (!types.length) return TROLLS.generic[langCode] || TROLLS.generic.zh;
  const bucket = TROLLS[types[0]] || TROLLS.generic;
  return bucket[langCode] || bucket.zh || TROLLS.generic[langCode] || TROLLS.generic.zh;
}

async function typewriter(el, text, speed = 42) {
  el.textContent = "";
  for (let i = 0; i < text.length; i++) {
    el.textContent += text[i];
    await new Promise(r => setTimeout(r, speed));
  }
}

function showTroll(langCode, animate = true) {
  const text = pickTroll(langCode);
  const el = $("trollText");
  if (animate) typewriter(el, text);
  else el.textContent = text;
  const typeName = state.hitTypes.length ? ATTRS[state.hitTypes[0]][langCode] : t("badge.clean").slice(2, 14);
  const langName = LANGS.find(l => l.code === langCode).name;
  $("trollSub").textContent = t("troll.sub", { type: typeName, lang: langName });
}

function renderCorpus() {
  const grid = $("corpus");
  grid.innerHTML = "";
  LANGS.forEach(l => {
    const item = document.createElement("div");
    item.className = "lang-item";
    const text = TROLLS.generic[l.code] || TROLLS.generic.zh;
    const h = document.createElement("div");
    h.className = "lh";
    h.textContent = `${l.flag} ${l.name} / ${l.code}`;
    const b = document.createElement("div");
    b.className = "lt";
    b.textContent = text;
    item.appendChild(h);
    item.appendChild(b);
    grid.appendChild(item);
  });
}

function detectLang() {
  const raw = (navigator.language || navigator.userLanguage || "zh").toLowerCase();
  const base = raw.split("-")[0].split("_")[0];
  return LANGS.some(l => l.code === base) ? base : "zh";
}

/* ============ 全局语言应用 ============ */
function applyLang(code) {
  state.lang = code;
  document.documentElement.lang = code;
  document.title = t("docTitle");

  // 静态文案
  document.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });

  // 动态区域
  const lang = LANGS.find(l => l.code === code);
  $("langPill").textContent = `${lang.flag} ${lang.name}`;
  $("referer").textContent = document.referrer ? new URL(document.referrer).hostname : t("ua.none");
  renderBadges();
  showTroll(code, false);
  renderCorpus();

  // 终端日志随语言重放
  termBody.innerHTML = "";
  replayLog();
}

/* ============ 终端日志 ============ */
function replayLog() {
  log("t-info", t("log.init"));
  log("t-info", t("log.target", { url: location.href.slice(0, 120) }));
  log("t-dim", "UA: " + navigator.userAgent.slice(0, 100));
  log("t-warn", t("log.analyzing"));

  const types = state.hitTypes;
  if (types.length) {
    log("t-err", t("log.total", { n: types.length }));
    log("t-err", t("log.threat", { level: types.length > 1 ? t("level.critical") : t("level.high") }));
  } else {
    log("t-ok", t("log.noHit"));
    log("t-dim", t("log.sneak"));
  }

  log("t-info", t("log.lang", { name: LANGS.find(l => l.code === state.lang).name }));
  log("t-dim", t("log.ip"));
  log("t-ok", t("log.done", { n: LANGS.length }));
}

function run() {
  analyze();
  applyLang(detectLang());
}

/* ============ 交互 ============ */
$("btnLang").addEventListener("click", () => {
  const idx = LANGS.findIndex(l => l.code === state.lang);
  const next = LANGS[(idx + 1) % LANGS.length];
  applyLang(next.code);
  log("t-info", t("log.switch", { flag: next.flag, name: next.name }));
});

$("btnCopy").addEventListener("click", async () => {
  const text = $("trollText").textContent;
  try {
    await navigator.clipboard.writeText(text);
    log("t-ok", t("log.copyOk"));
  } catch {
    const ta = document.createElement("textarea");
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); ta.remove();
    log("t-ok", t("log.copyOk2"));
  }
});

$("btnRescan").addEventListener("click", () => {
  log("t-warn", t("log.rescan"));
  setTimeout(() => run(), 400);
});

/* 时钟 */
setInterval(() => { $("clock").textContent = now(); }, 1000);

/* 启动 */
document.addEventListener("DOMContentLoaded", () => {
  $("ua").textContent = navigator.userAgent.slice(0, 60);
  $("time").textContent = new Date().toLocaleString();
  $("len").textContent = location.href.length + " chars";
  run();
});
</script>
</body>
